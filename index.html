<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои рецепты</title>
<meta name="description" content="Рецепты с фотографиями: завтраки, обеды, ужины, перекусы, правильное питание, праздничное меню и авторские чаи">
<meta name="theme-color" content="#faf6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap&subset=cyrillic">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Рецепты">
<style>
:root {
  --bg: #faf6f2; --surface: #ffffff; --surface-2: #f3ece6; --text: #2b211c; --muted: #85746a; --line: #ebe2da;
  --accent: #e4572e; --accent-ink: #ffffff; --accent-soft: #fde8e0;
  --pen: #2453b8; --pp: #3f8f4e; --pp-soft: #e5f3e3;
  --shadow: 0 1px 2px rgba(60,30,10,.06), 0 6px 20px rgba(60,30,10,.07);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #181311; --surface: #231c19; --surface-2: #2d2421; --text: #f4ece7; --muted: #a8978d; --line: #362c28;
          --accent: #ff7149; --accent-ink: #1b0f0b; --accent-soft: #3d2620;
          --pen: #8fb4ff; --pp: #7cc98a; --pp-soft: #1f3322;
          --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text);
       -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body.lock { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 20px; height: 20px; flex: none; display: block; }

/* ---------- Шапка ---------- */
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
         backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: calc(10px + var(--safe-t)) 16px 0; border-bottom: 1px solid transparent; transition: border-color .2s; }
header.scrolled { border-bottom-color: var(--line); }
.wrap { max-width: 1100px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 8px; min-height: 42px; }
@media (max-width: 360px) { h1 { font-size: 21px !important; white-space: normal !important; } }
h1 { font-size: 26px; line-height: 1.1; margin: 0; flex: 1; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 14px; border-radius: 12px;
       background: var(--surface); border: 1px solid var(--line); font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform .1s; position: relative; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.sq { width: 42px; padding: 0; }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

.search-row { display: flex; gap: 8px; margin-top: 10px; }
.search { flex: 1; position: relative; }
.search .i { position: absolute; left: 12px; top: 12px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 40px; outline: none; font-size: 16px; -webkit-appearance: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--accent); }
.search .clear { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border-radius: 50%; display: none; align-items: center; justify-content: center; color: var(--muted); }
.search.has .clear { display: flex; }
.search-row .btn { height: 44px; width: 44px; padding: 0; }

/* Вкладки-разделы */
.sections { position: relative; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 12px -16px 0; padding: 0 16px 12px; }
.sections::-webkit-scrollbar { display: none; }
.sec-tab { flex: none; display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px 0 11px; border-radius: 999px; border: 1px solid var(--line);
           background: var(--surface); font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--text); transition: background .15s, color .15s, border-color .15s; }
.sec-tab .i { width: 18px; height: 18px; color: var(--accent); }
.sec-tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sec-tab.on .i { color: var(--accent-ink); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s; }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }

/* ---------- Главная: ленты по разделам ---------- */
main { padding: 4px 16px calc(40px + var(--safe-b)); }
.row { margin: 10px 0 26px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.row-head h2 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
.row-head button { color: var(--accent); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.row-head button .i { width: 16px; height: 16px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: min(72%, 260px); gap: 14px; overflow-x: auto; scrollbar-width: none;
         margin: 0 -16px; padding: 2px 16px 10px; scroll-snap-type: x mandatory; scroll-padding: 16px; }
.strip::-webkit-scrollbar { display: none; }
.strip .card { scroll-snap-align: start; }
.strip .card h3 { font-size: 16px; }

/* ---------- Список ---------- */
.count { color: var(--muted); font-size: 14px; margin: 8px 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.count button { color: var(--accent); font-size: 14px; font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; position: relative;
        transition: transform .15s; animation: rise .3s ease both; }
.card:active { transform: scale(.98); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.media { position: relative; aspect-ratio: 4/3; background: var(--surface-2); overflow: hidden; }
.media::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.25) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
.media.ok::before, .media.fail::before { display: none; }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .35s; }
.media.ok img { opacity: 1; }
.media.fail::after { content: attr(data-emoji); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; background: linear-gradient(135deg, var(--accent-soft), var(--surface-2)); }
.card .body { padding: 12px 14px 14px; }
.card h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.25; letter-spacing: -.01em; }
.meta { display: flex; gap: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta .i { width: 15px; height: 15px; }
.fav { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.92); color: #2b211c;
       display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 1; }
.fav.on { color: #e4372e; }
.fav:active { transform: scale(.9); }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 56px 20px; }
.empty .big { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.empty .big .i { width: 28px; height: 28px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }

/* ---------- Панели ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; visibility: hidden; pointer-events: none; }
.sheet::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .25s; }
.sheet.open { visibility: visible; pointer-events: auto; }
.sheet.open::before { opacity: 1; }
.panel { position: relative; background: var(--bg); width: 100%; max-width: 720px; height: 100%; overflow-y: auto; overscroll-behavior: contain;
         transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding-bottom: calc(24px + var(--safe-b)); }
.sheet.open .panel { transform: none; }
@media (min-width: 760px) {
  .sheet { align-items: center; padding: 24px; }
  .panel { height: auto; max-height: calc(100vh - 48px); border-radius: 24px; transform: translateY(24px) scale(.98); opacity: 0; transition: transform .25s, opacity .25s; }
  .sheet.open .panel { opacity: 1; }
}
.hero { position: relative; }
.hero .media { aspect-ratio: 4/3; max-height: 56vh; width: 100%; }
@media (min-width: 760px) { .hero .media { aspect-ratio: 16/10; } }
.hero-bar { position: absolute; top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: flex; gap: 8px; z-index: 2; }
.hero-bar .sp { flex: 1; }
.glass { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.92); color: #2b211c; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.glass.on { color: #e4372e; }
.content { padding: 20px 18px 8px; max-width: 720px; margin: -22px auto 0; position: relative; background: var(--bg); border-radius: 22px 22px 0 0; }
.content h2 { margin: 0 0 10px; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); padding: 5px 10px; border-radius: 999px; }
.tag.sec { background: var(--accent-soft); color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 6px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; }
.stat .i { margin: 0 auto 6px; color: var(--accent); }
.stat b { display: block; font-size: 15px; }
.stat > span { font-size: 12px; color: var(--muted); }
.stat.portions { padding: 8px 4px 12px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 4px; }
.stepper b { min-width: 26px; font-size: 18px; }
.stepper button { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.stepper button .i { width: 16px; height: 16px; margin: 0; }
.stepper button:disabled { opacity: .35; }
.scaled { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: -2px 0 10px; font-size: 13px; color: var(--muted); }
.scaled button { color: var(--accent); font-size: 13px; font-weight: 500; white-space: nowrap; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 8px; }
.sec-h h4 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.sec-h button { color: var(--accent); font-size: 14px; font-weight: 500; }
.ing { list-style: none; padding: 0; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ing label { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-bottom: 1px solid var(--line); cursor: pointer; line-height: 1.4; }
.ing li:last-child label { border-bottom: none; }
.ing input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; flex: none; border: 2px solid var(--line); border-radius: 7px; display: grid; place-content: center; transition: background .15s, border-color .15s; }
.ing input::after { content: ""; width: 10px; height: 6px; border: solid var(--accent-ink); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px,-1px); opacity: 0; }
.ing input:checked { background: var(--accent); border-color: var(--accent); }
.ing input:checked::after { opacity: 1; }
.ing input:checked + span { text-decoration: line-through; color: var(--muted); }
/* ПП-версия: переключатель и «рукописные» замены поверх зачёркнутого ингредиента */
.pp-switch { display: flex; align-items: center; gap: 12px; width: 100%; margin: 20px 0 0; padding: 12px 14px; border-radius: 16px; background: var(--pp-soft); color: var(--text); text-align: left; }
.pp-switch .i { color: var(--pp); flex: none; }
.pp-switch .txt { flex: 1; line-height: 1.3; }
.pp-switch b { display: block; font-size: 15px; }
.pp-switch small { color: var(--muted); font-size: 13px; }
.pp-switch .knob { flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background .2s; }
.pp-switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.pp-switch[aria-checked="true"] .knob { background: var(--pp); }
.pp-switch[aria-checked="true"] .knob::after { transform: translateX(18px); }
.pp-done { margin: 20px 0 0; padding: 12px 14px; border-radius: 16px; background: var(--pp-soft); color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.pp-done .i { color: var(--pp); flex: none; }
.swap .hand { display: none; }
.swap s { text-decoration: none; }
.pp .swap .hand { display: block; font-family: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive; font-weight: 600; font-size: 23px; line-height: 1; color: var(--pen); transform: rotate(-2.5deg); transform-origin: left bottom; margin: 0 0 1px 4px; animation: write .6s ease-out both; }
.pp .swap s { color: var(--muted); background: linear-gradient(var(--pen), var(--pen)) no-repeat 0 58% / 100% 2px; animation: strike .35s ease-out both; }
.ing input:checked + span .hand { opacity: .55; }
.ing:not(.pp) + .pp-hint { display: none; }
.pp-hint .i { color: var(--pp); }
.stat .swap .hand { margin: -4px 0 1px; transform-origin: center; font-size: 22px; }
.pp .stat .swap s { font-weight: 500; font-size: 13px; }
@keyframes strike { from { background-size: 0 2px; } }
@keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { .pp .swap .hand, .pp .swap s { animation: none; } }
.steps { padding: 0; margin: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 2px 0 18px 46px; line-height: 1.55; font-size: 16px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 14px; top: 34px; bottom: 4px; width: 2px; background: var(--line); }
.note { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; margin-top: 14px; }
.note .i { width: 16px; height: 16px; }

/* Фильтры */
.sheet.compact .panel { height: auto; max-height: 88vh; border-radius: 22px 22px 0 0; }
@media (min-width: 760px) { .sheet.compact .panel { border-radius: 24px; max-width: 520px; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.ph-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 10px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.ph-head h2 { margin: 0; font-size: 21px; }
.fgroup { padding: 8px 18px 10px; }
.flabel { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.flabel b { color: var(--accent); font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; height: 36px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.foot { display: flex; gap: 8px; padding: 14px 18px 0; }
.foot .btn { flex: 1; height: 48px; }

/* Уведомления */
#toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translate(-50%, 12px); background: #2b211c; color: #fff;
         padding: 12px 16px; border-radius: 14px; font-size: 14px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 60;
         max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { color: #ffb59c; font-weight: 600; white-space: nowrap; }
@media (prefers-color-scheme: dark) { #toast { background: #f4ece7; color: #1b0f0b; } #toast button { color: #c93a1a; } }

/* ---------- Главный экран-меню: обложка открывается, как настоящее меню ---------- */
:root { --paper: #fbf8f2; --paper-2: #f2ece2; --paper-ink: #2b211c; --paper-line: #d9cdbd; --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; --paper-glow: rgba(255,255,255,.55); }
@media (prefers-color-scheme: dark) { :root { --paper: #221c18; --paper-2: #1a1512; --paper-ink: #f1e7dc; --paper-line: #4a3d34; --paper-glow: rgba(255,240,225,.035); } }
html:has(body.menu-on), body.menu-on { overflow: hidden; }
.menu { position: fixed; inset: 0; z-index: 50; background: var(--paper-2); perspective: 2000px; transition: opacity .35s, transform .35s; }
.menu.leaving { opacity: 0; transform: scale(1.03); pointer-events: none; }
.menu-inside { position: absolute; inset: 0; overflow-y: auto; background: var(--paper); color: var(--paper-ink);
  padding: calc(40px + var(--safe-t)) 28px calc(32px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; }
/* тень от обложки, которая уходит, пока меню открывается */
.menu-inside::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(40,20,5,.28), rgba(40,20,5,.05) 40%, transparent); opacity: 1; transition: opacity 1.1s ease; }
.menu.opened .menu-inside::before { opacity: 0; }
.menu:not(.opened) .menu-inside { overflow: hidden; }
.mi-page { width: 100%; max-width: 420px; margin: auto 0; }
.mi-kicker { font-family: var(--serif); font-style: italic; font-size: 18px; text-align: center; color: var(--muted); }
.mi-title { font-family: var(--serif); font-weight: 600; font-size: 52px; line-height: 1; text-align: center; margin: 4px 0 6px; letter-spacing: .02em; }
.mi-orn { display: flex; align-items: center; gap: 12px; color: var(--paper-line); margin: 0 auto 22px; max-width: 220px; font-size: 14px; }
.mi-orn::before, .mi-orn::after { content: ""; flex: 1; height: 1px; background: currentColor; }
.mi-list { display: flex; flex-direction: column; }
.mi-item { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 11px 2px; font-family: var(--serif); font-size: 25px; font-weight: 500; color: var(--paper-ink); text-align: left; }
.mi-item .dots { flex: 1; border-bottom: 2px dotted var(--paper-line); transform: translateY(-6px); min-width: 20px; }
.mi-item .n { font-size: 20px; font-style: italic; color: var(--muted); }
.mi-item:active { color: var(--accent); }
.mi-extra { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--paper-line); }
.mi-extra .mi-item { font-size: 21px; padding: 9px 2px; }
/* строки разворота проявляются по очереди, когда обложка открылась */
.mi-page > * { opacity: 0; transform: translateY(6px); transition: opacity .45s ease, transform .45s ease; }
.menu.opened .mi-page > * { opacity: 1; transform: none; }
.menu.opened .mi-page > :nth-child(2) { transition-delay: .55s; } .menu.opened .mi-page > :nth-child(3) { transition-delay: .6s; }
.menu.opened .mi-page > :nth-child(4) { transition-delay: .7s; } .menu.opened .mi-page > :nth-child(5) { transition-delay: .85s; }
.menu.instant .mi-page > *, .menu.instant .menu-inside::before { transition: none !important; }
/* обложка: лицевая сторона и оборот, поворачивается вокруг левого края */
.menu-cover { position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d; transition: transform 1.15s cubic-bezier(.55,.05,.2,1), visibility 0s 1.15s; }
.menu.opened .menu-cover { transform: rotateY(-178deg); visibility: hidden; }
.menu.instant .menu-cover { transition: none; }
.cover-face, .cover-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.cover-face { background: radial-gradient(ellipse at 30% 20%, var(--paper-glow), transparent 60%), var(--paper); color: var(--paper-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset -10px 0 24px -14px rgba(60,30,10,.35); }
.cover-face::before { content: ""; position: absolute; inset: calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b)); border: 1px solid var(--paper-line); outline: 1px solid var(--paper-line); outline-offset: -6px; pointer-events: none; }
.cover-back { background: var(--paper-2); transform: rotateY(180deg); box-shadow: inset 12px 0 30px -10px rgba(60,30,10,.3); }
.cover-kicker { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--muted); }
.cover-title { font-family: var(--serif); font-weight: 600; font-size: 76px; line-height: 1; letter-spacing: .04em; margin: 6px 0 10px; }
.cover-orn { width: 150px; margin: 0; }
.menu:not(.font-ready) .cover-face > * { opacity: 0; }
.cover-face > * { transition: opacity .4s; }
.cover-hint { position: absolute; bottom: calc(56px + var(--safe-b)); font-size: 14px; color: var(--muted); animation: hint 2.4s ease-in-out infinite; }
@keyframes hint { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- Главный экран: меню. Обложка открывается, под ней разворот с разделами -->
<div class="menu" id="menu" hidden>
  <div class="menu-inside">
    <div class="mi-page">
      <div class="mi-kicker">Мои рецепты</div>
      <h2 class="mi-title">Меню</h2>
      <div class="mi-orn">✦</div>
      <nav class="mi-list" id="menuList" aria-label="Разделы меню"></nav>
      <div class="mi-list mi-extra" id="menuExtra"></div>
    </div>
  </div>
  <button class="menu-cover" id="menuCover" aria-label="Открыть меню">
    <span class="cover-face"><span class="cover-kicker">Мои рецепты</span><span class="cover-title">Меню</span><span class="mi-orn cover-orn">✦</span><span class="cover-hint">Нажмите, чтобы открыть</span></span>
    <span class="cover-back"></span>
  </button>
</div>

<header id="hdr">
  <div class="wrap">
    <div class="top">
      <button class="btn sq" id="menuBtn" aria-label="Меню" data-i="book"></button>
      <h1 id="title">Рецепты</h1>
      <button class="btn primary" id="installBtn" hidden></button>
      <button class="btn sq" id="favBtn" aria-label="Избранное"><span class="dot" id="favN" hidden></span></button>
    </div>
    <div class="search-row">
      <div class="search" id="searchBox">
        <span data-i="search"></span>
        <input id="q" type="search" placeholder="Блюдо или продукт" autocomplete="off" enterkeyhint="search" aria-label="Поиск">
        <button class="clear" id="qClear" aria-label="Очистить поиск" data-i="x"></button>
      </div>
      <button class="btn" id="filterBtn" aria-label="Фильтры"><span data-i="sliders"></span><span class="dot" id="filterDot" hidden></span></button>
    </div>
    <nav class="sections" id="sections" aria-label="Разделы"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<!-- Просмотр рецепта -->
<div class="sheet" id="viewSheet" role="dialog" aria-modal="true"><div class="panel" id="viewPanel"></div></div>

<!-- Фильтры -->
<div class="sheet compact" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="panel">
    <div class="grab"></div>
    <div class="ph-head"><h2 id="fTitle">Фильтры</h2><button class="btn sq ghost" data-close aria-label="Закрыть" data-i="x"></button></div>
    <div class="fgroup">
      <div class="flabel">Сортировка</div>
      <div class="seg" id="sortSeg">
        <button data-sort="default">Обычная</button><button data-sort="time">Быстрые</button><button data-sort="kcal">По ккал</button>
      </div>
    </div>
    <div class="fgroup">
      <div class="flabel">Время приготовления <b id="timeVal"></b></div>
      <input type="range" id="time" min="15" max="240" step="15" value="240" aria-label="Максимальное время">
    </div>
    <div class="fgroup">
      <div class="flabel">Калорийность порции</div>
      <div class="chips" id="kcalChips"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">Особенности</div>
      <div class="chips" id="tagChips"></div>
    </div>
    <div class="foot">
      <button class="btn" id="resetBtn">Сбросить</button>
      <button class="btn primary" data-close id="applyBtn">Показать</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>

<script src="recipes.js"></script>
<script>
// Калорийность одной порции: [подпись, от, до)
const KCAL = [['до 300 ккал', 0, 300], ['300–500', 300, 500], ['500–700', 500, 700], ['больше 700', 700, Infinity]];
const MAX_TIME = 240;

// ---------- Иконки ----------
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  book: '<path d="M3 5.5c2.5-1 5.5-1 9 1 3.5-2 6.5-2 9-1v13c-2.5-1-5.5-1-9 1-3.5-2-6.5-2-9-1z"/><path d="M12 6.5v13"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flame: '<path d="M12 21c-3.9 0-7-2.8-7-6.6 0-2.9 1.8-5 3.6-6.9.4 1.6 1.3 2.7 2.4 3.1C11 7 12.5 4.6 15 3c-.3 2.6.7 4.5 2.2 6.2A7.4 7.4 0 0 1 19 14.4C19 18.2 15.9 21 12 21Z"/>',
  minus: '<path d="M5 12h14"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2c2 .8 3.5 2.9 3.5 5.8"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  next: '<path d="M9 5l7 7-7 7"/>',
  share: '<path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z"/><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  frown: '<circle cx="12" cy="12" r="9"/><path d="M8.5 16a4.5 4.5 0 0 1 7 0M9 9.5h.01M15 9.5h.01"/>',
  // разделы
  all: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  breakfast: '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2.5c-.6 1 .6 1.8 0 3M12 2.5c-.6 1 .6 1.8 0 3"/>',
  lunch: '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 3.5c-.7 1.2.7 2 0 3.5M12 3.5c-.7 1.2.7 2 0 3.5M16 3.5c-.7 1.2.7 2 0 3.5"/>',
  dinner: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
  snack: '<path d="M12 7c-1.5-1-5-1.5-6.5 1.5S5 17 8 20c1.5 1.5 3 .5 4 .5s2.5 1 4-.5c3-3 4-8.5 2.5-11.5S13.5 6 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/>',
  healthy: '<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-4 6-6.5 9.5-8.5"/>',
  festive: '<path d="M4 20 9 7l8 8z"/><path d="M14 4.5v.01M19.5 10v.01M17 3l-.8 2.2M21 7l-2.2.8M12.5 9.5 15 7"/>',
  drinks: '<path d="M5 10h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M5 12.5 2.5 10"/><path d="M8.5 7.5h5M11 7.5V5.5"/><path d="M8 21h6"/>'
};
const icon = (n, fill) => `<svg class="i" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.i)));
document.querySelectorAll('span[data-i]').forEach(el => el.replaceWith(el.firstChild));

// ---------- Хранилище (если недоступно — работаем в памяти) ----------
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
try { localStorage.removeItem('userRecipes'); } catch {}   // своих рецептов больше нет

const ids = new Set(RECIPES.map(r => r.id));
let favorites = new Set(store.get('favorites', []).filter(id => ids.has(id)));
const freshFilters = () => ({ maxTime: MAX_TIME, kcal: new Set(), tags: new Set(), sort: 'default' });
const state = Object.assign({ q: '', section: 'all', favOnly: false }, freshFilters());

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = id => RECIPES.find(r => r.id === id);
const sectionById = id => SECTIONS.find(s => s.id === id);
const fmtTime = m => m >= 60 ? `${Math.floor(m / 60)} ч${m % 60 ? ' ' + (m % 60) + ' мин' : ''}` : `${m} мин`;
// Полное время с ожиданием (холодильник, маринование) — по нему фильтруем и сортируем
const totalTime = r => r.time + (r.wait || 0);
const fmtWait = r => r.wait ? `+ ${fmtTime(r.wait)} ${r.waitFor}` : '';
// Единицы порций: [1, 2–4, 5+, «на 1 …» (винительный), подпись к калориям]. У напитков — чашки
const UNITS = {
  portion: ['порция', 'порции', 'порций', 'порцию', 'на порцию'],
  cup: ['чашка', 'чашки', 'чашек', 'чашку', 'на чашку'],
  piece: ['штука', 'штуки', 'штук', 'штуку', 'на штуку'],
  ball: ['шарик', 'шарика', 'шариков', 'шарик', 'на шарик']
};
const unitOf = r => UNITS[r.unit || (r.sections.includes('drinks') ? 'cup' : 'portion')];
// acc — форма после «на»: «на 1 порцию», «на 2 порции»
const unitWord = (r, n, acc) => { const u = unitOf(r), w = plural(n, u[0], u[1], u[2]); return acc && w === u[0] ? u[3] : w; };
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const recipesWord = n => `${n} ${plural(n, 'рецепт', 'рецепта', 'рецептов')}`;

// Постоянное сообщение (предложение обновиться) не исчезает само;
// обычные сообщения показываются поверх и затем возвращают его на экран
let sticky = null;
function toast(msg, action, onAction, isSticky) {
  const t = $('#toast'), b = $('#toastBtn');
  if (isSticky) sticky = { msg, action, onAction };
  $('#toastMsg').textContent = msg; b.hidden = !action; b.textContent = action || '';
  b.onclick = () => { t.classList.remove('show'); if (isSticky) sticky = null; onAction && onAction(); };
  t.classList.add('show'); clearTimeout(t._h);
  if (!isSticky) t._h = setTimeout(() => {
    t.classList.remove('show');
    if (sticky) t._h = setTimeout(() => toast(sticky.msg, sticky.action, sticky.onAction, true), 300);
  }, action ? 6000 : 2200);
}

// Фото с плавным появлением; при ошибке — заглушка с эмодзи
function media(r, eager) {
  const emoji = esc(r.emoji || '🍽️');
  if (!r.image) return `<div class="media fail" data-emoji="${emoji}"></div>`;
  return `<div class="media" data-emoji="${emoji}"><img src="${esc(r.image)}" alt="" ${eager ? '' : 'loading="lazy"'} decoding="async"
    onload="this.parentNode.classList.add('ok')" onerror="this.parentNode.classList.add('fail');this.remove()"></div>`;
}

function card(r, i, eager) {
  const on = favorites.has(r.id);
  return `<article class="card" data-id="${esc(r.id)}" style="animation-delay:${Math.min(i, 8) * 30}ms" tabindex="0" aria-label="${esc(r.title)}">
      ${media(r, eager)}
      <button class="fav ${on ? 'on' : ''}" data-fav="${esc(r.id)}" aria-label="${on ? 'Убрать из избранного' : 'В избранное'}">${icon('heart', on)}</button>
      <div class="body">
        <h3>${esc(r.title)}</h3>
        <div class="meta"><span>${icon('clock')}${fmtTime(r.time)}${r.wait ? ' + ' + fmtTime(r.wait) : ''}</span><span>${icon('flame')}${r.kcal} ккал</span></div>
      </div>
    </article>`;
}

// ---------- Фильтрация ----------
const filterCount = () => state.kcal.size + state.tags.size + (state.maxTime < MAX_TIME ? 1 : 0) + (state.sort !== 'default' ? 1 : 0);
const narrowed = () => filterCount() > 0 || !!state.q.trim();

// Поиск без учёта окончаний: «курица» найдёт «куриная», «яйца» — «яйцо»
const norm = s => s.toLowerCase().replace(/ё/g, 'е');
const stem = w => w.length >= 6 ? w.slice(0, -2) : w.length >= 4 ? w.slice(0, -1) : w;
const searchText = new Map(RECIPES.map(r => [r.id, norm([r.title, ...r.ingredients, ...r.tags, ...r.sections.map(s => sectionById(s).title), r.keywords || ''].join(' '))]));
function matches(r) {
  const words = norm(state.q).split(/[\s,]+/).filter(Boolean).map(stem);
  return (state.maxTime >= MAX_TIME || totalTime(r) <= state.maxTime) &&
    (!state.kcal.size || KCAL.some(([l, lo, hi]) => state.kcal.has(l) && r.kcal >= lo && r.kcal < hi)) &&
    [...state.tags].every(t => r.tags.includes(t)) &&
    words.every(w => searchText.get(r.id).includes(w));
}
function sorted(list) {
  if (state.sort === 'time') return list.slice().sort((a, b) => totalTime(a) - totalTime(b));
  if (state.sort === 'kcal') return list.slice().sort((a, b) => a.kcal - b.kcal);
  return list;
}
// Насколько рецепт подходит под поиск: 0 — слово в названии, 1 — в ключевых словах, разделе или теге, 2 — только в ингредиентах
const titleText = new Map(RECIPES.map(r => [r.id, norm(r.title)]));
const aboutText = new Map(RECIPES.map(r => [r.id, norm([r.title, r.keywords || '', ...r.tags, ...r.sections.map(s => sectionById(s).title)].join(' '))]));
function searchRank(r, words) {
  if (words.every(w => titleText.get(r.id).includes(w))) return 0;
  return words.every(w => aboutText.get(r.id).includes(w)) ? 1 : 2;
}
function filtered() {
  const list = sorted(RECIPES.filter(r =>
    (!state.favOnly || favorites.has(r.id)) &&
    (state.section === 'all' || r.sections.includes(state.section)) &&
    matches(r)));
  const words = norm(state.q).split(/[\s,]+/).filter(Boolean).map(stem);
  if (!words.length || state.sort !== 'default') return list;
  const rank = new Map(list.map(r => [r.id, searchRank(r, words)]));
  return list.sort((a, b) => rank.get(a.id) - rank.get(b.id));   // сортировка устойчивая: внутри группы порядок прежний
}

function chip(label, on, onClick) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip' + (on ? ' on' : ''); b.textContent = label; b.onclick = onClick; b.setAttribute('aria-pressed', on);
  return b;
}
const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
const ALL_TAGS = [...new Set(RECIPES.flatMap(r => r.tags))];

function renderControls() {
  $('#sections').innerHTML = [{ id: 'all', title: 'Все' }, ...SECTIONS].map(s =>
    `<button class="sec-tab ${state.section === s.id ? 'on' : ''}" data-sec="${s.id}" aria-current="${state.section === s.id}">${icon(s.id)}${s.title}</button>`).join('');
  const kc = $('#kcalChips'); kc.innerHTML = '';
  KCAL.forEach(([l]) => kc.append(chip(l, state.kcal.has(l), () => { toggle(state.kcal, l); update(); })));
  const tc = $('#tagChips'); tc.innerHTML = '';
  ALL_TAGS.forEach(t => tc.append(chip(t, state.tags.has(t), () => { toggle(state.tags, t); update(); })));
  document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.sort === state.sort));
  $('#time').value = state.maxTime;
  $('#timeVal').textContent = state.maxTime >= MAX_TIME ? 'любое' : 'до ' + fmtTime(state.maxTime);
  const n = filterCount();
  $('#filterBtn').classList.toggle('on', n > 0); $('#filterDot').hidden = !n; $('#filterDot').textContent = n;
  $('#searchBox').classList.toggle('has', !!state.q);
  $('#favBtn').innerHTML = icon('heart', state.favOnly) + `<span class="dot" id="favN" ${favorites.size ? '' : 'hidden'}>${favorites.size}</span>`;
  $('#favBtn').classList.toggle('on', state.favOnly);
  $('#favBtn').setAttribute('aria-pressed', state.favOnly);
  $('#title').textContent = state.favOnly ? 'Избранное' : state.section === 'all' ? 'Рецепты' : sectionById(state.section).title;
}

function emptyState() {
  if (state.favOnly && !favorites.size)
    return `<div class="empty"><div class="big">${icon('heart')}</div><b>Здесь пока пусто</b>Нажмите на сердечко у рецепта —<br>и он появится в избранном.</div>`;
  const canReset = narrowed() || state.section !== 'all' || state.favOnly;
  return `<div class="empty"><div class="big">${icon('frown')}</div><b>Ничего не нашлось</b>Попробуйте другой запрос${canReset ? ' или другой раздел.<br><button class="btn" data-reset>Показать все рецепты</button>' : '.'}</div>`;
}

function render() {
  const main = $('#main');
  // Главная без поиска и фильтров — ленты по разделам
  if (state.section === 'all' && !state.favOnly && !narrowed()) {
    main.innerHTML = SECTIONS.map(s => {
      const list = RECIPES.filter(r => r.sections.includes(s.id));
      return `<section class="row">
        <div class="row-head"><h2>${s.title}</h2><button data-sec="${s.id}">Все ${list.length}${icon('next')}</button></div>
        <div class="strip">${list.map((r, i) => card(r, i, s === SECTIONS[0] && i < 2)).join('')}</div>
      </section>`;
    }).join('');
    $('#applyBtn').textContent = `Показать ${RECIPES.length}`;
    return;
  }
  const list = filtered();
  $('#applyBtn').textContent = list.length ? `Показать ${list.length}` : 'Ничего не найдено';
  main.innerHTML = `
    <div class="count"><span>${list.length ? recipesWord(list.length) : ''}</span>${narrowed() && list.length ? '<button data-reset-filters>Сбросить фильтры</button>' : ''}</div>
    <div class="grid">${list.length ? list.map((r, i) => card(r, i, i < 4)).join('') : emptyState()}</div>`;
}

function update() { renderControls(); render(); }
// Прокручивает ленту вкладок так, чтобы выбранная была по центру
function centerTab() {
  const strip = $('#sections'), tab = strip.querySelector('.sec-tab.on'); if (!tab) return;
  strip.scrollLeft = tab.offsetLeft - (strip.clientWidth - tab.offsetWidth) / 2;
}
function goSection(id) { state.section = id; state.favOnly = false; update(); scrollTo(0, 0); centerTab(); }

$('#main').addEventListener('click', e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const sec = e.target.closest('[data-sec]'); if (sec) { goSection(sec.dataset.sec); return; }
  if (e.target.closest('[data-reset]')) { Object.assign(state, freshFilters(), { q: '', section: 'all', favOnly: false }); $('#q').value = ''; update(); return; }
  if (e.target.closest('[data-reset-filters]')) { Object.assign(state, freshFilters(), { q: '' }); $('#q').value = ''; update(); return; }
  const c = e.target.closest('.card'); if (c) openRecipe(c.dataset.id);
});
$('#main').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) openRecipe(e.target.dataset.id); });
$('#sections').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) goSection(b.dataset.sec); });

function toggleFav(id) {
  toggle(favorites, id); store.set('favorites', [...favorites]);
  if (navigator.vibrate) navigator.vibrate(10);
  toast(favorites.has(id) ? 'Добавлено в избранное' : 'Убрано из избранного');
  // На главной перерисовываем только сердечки, чтобы ленты не прокручивались в начало
  if (!state.favOnly) {
    document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b => {
      const on = favorites.has(id); b.classList.toggle('on', on); b.innerHTML = icon('heart', on);
      b.setAttribute('aria-label', on ? 'Убрать из избранного' : 'В избранное');
    });
    renderControls();
  } else update();
  if ($('#viewSheet').classList.contains('open')) refreshFavButton(id);
}

let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; update(); }, 150); });
$('#qClear').onclick = () => { $('#q').value = ''; state.q = ''; update(); $('#q').focus(); };
$('#time').addEventListener('input', e => { state.maxTime = +e.target.value; update(); });
$('#sortSeg').onclick = e => { const b = e.target.closest('[data-sort]'); if (b) { state.sort = b.dataset.sort; update(); } };
$('#filterBtn').onclick = () => openSheet('#filterSheet');
$('#favBtn').onclick = () => { state.favOnly = !state.favOnly; update(); scrollTo({ top: 0, behavior: 'smooth' }); };
$('#resetBtn').onclick = () => { Object.assign(state, freshFilters()); update(); };
addEventListener('scroll', () => $('#hdr').classList.toggle('scrolled', scrollY > 4), { passive: true });

// ---------- Панели и кнопка «Назад» на телефоне ----------
const openSheets = () => [...document.querySelectorAll('.sheet.open')];
function openSheet(sel) {
  const el = $(sel);
  openSheets().forEach(s => s !== el && s.classList.remove('open'));
  el.classList.add('open'); document.body.classList.add('lock');
  if (!(history.state && history.state.sheet)) history.pushState({ sheet: 1 }, '');
}
function closeSheets(fromHistory) {
  if (!openSheets().length) return;
  openSheets().forEach(s => s.classList.remove('open'));
  document.body.classList.remove('lock'); releaseWake();
  if (!fromHistory && history.state && history.state.sheet) history.back();
}
// «Назад»: сначала закрываются панели, а из списка рецептов возвращаемся в меню
addEventListener('popstate', () => { closeSheets(true); if (!history.state) showMenu(false); });
document.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.classList.contains('sheet')) closeSheets(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

// Экран не гаснет, пока открыт рецепт (если телефон поддерживает)
let wake = null;
async function keepAwake() { try { wake = await navigator.wakeLock.request('screen'); } catch { wake = null; } }
function releaseWake() { if (wake) { wake.release().catch(() => {}); wake = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('#viewSheet').classList.contains('open')) keepAwake(); });

// ---------- Просмотр рецепта ----------
function refreshFavButton(id) {
  const on = favorites.has(id), b = $('#vFav'); if (!b) return;
  b.classList.toggle('on', on); b.innerHTML = icon('heart', on); b.setAttribute('aria-label', on ? 'Убрать из избранного' : 'В избранное');
}
function openRecipe(id) {
  const r = byId(id); if (!r) return;
  const checked = new Set(store.get('checked:' + id, []));
  const canShare = !!navigator.share;
  // Подсказку про экран показываем только в первом открытом рецепте
  const showWakeHint = 'wakeLock' in navigator && !store.get('wakeHint', false);
  if (showWakeHint) store.set('wakeHint', true);
  const swaps = r.ingredients.map(ppSwap), ppCount = swaps.filter(s => s.pp).length;
  const ppIds = new Set(store.get('pp', []));
  let ppOn = ppIds.has(id) && ppCount > 0;
  const ppK = ppKcal(r), kcalNow = () => ppOn ? ppK : r.kcal;
  $('#viewPanel').innerHTML = `
    <div class="hero">
      ${media(r, true)}
      <div class="hero-bar">
        <button class="glass" data-close aria-label="Назад">${icon('back')}</button><span class="sp"></span>
        ${canShare ? `<button class="glass" id="vShare" aria-label="Поделиться">${icon('share')}</button>` : ''}
        <button class="glass" id="vFav"></button>
      </div>
    </div>
    <div class="content">
      <h2>${esc(r.title)}</h2>
      <div class="tags">${r.sections.map(s => `<span class="tag sec">${esc(sectionById(s).title)}</span>`).join('')}${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="stats${ppOn ? ' pp' : ''}">
        <div class="stat">${icon('clock')}<b>${fmtTime(r.time)}</b><span>${r.wait ? esc(fmtWait(r)) : 'время'}</span></div>
        <div class="stat">${icon('flame')}<b>${ppK !== r.kcal
          ? `<span class="swap"><span class="hand">${ppK} ккал</span><s>${r.kcal} ккал</s></span>`
          : `${r.kcal} ккал`}</b><span>${unitOf(r)[4]}</span></div>
        <div class="stat portions">
          <div class="stepper"><button id="sMinus" aria-label="Меньше порций">${icon('minus')}</button><b id="sN">${r.servings}</b><button id="sPlus" aria-label="Больше порций">${icon('plus')}</button></div>
          <span id="sLbl">${unitWord(r, r.servings)}</span>
        </div>
      </div>
      ${swaps.some(s => s.pp)
        ? `<button class="pp-switch" id="vPP" role="switch" aria-checked="${ppOn}">${icon('leaf')}<span class="txt"><b>ПП-версия</b><small>${ppCount} ${plural(ppCount, 'замена', 'замены', 'замен')}: без глютена, лактозы и сахара</small></span><span class="knob"></span></button>`
        : `<div class="pp-done">${icon('leaf')}Без глютена, лактозы и сахара — замены не нужны</div>`}
      <div class="sec-h"><h4>Ингредиенты</h4><button id="vUncheck" ${checked.size ? '' : 'hidden'}>Снять отметки</button></div>
      <div class="scaled" id="vScaled" hidden><span id="vScaledTxt"></span><button id="vScaleReset">Как в рецепте</button></div>
      <ul class="ing${ppOn ? ' pp' : ''}">${swaps.map((s, n) => `<li><label><input type="checkbox" data-n="${n}" ${checked.has(n) ? 'checked' : ''}><span>${s.pp
        ? `<span class="swap"><span class="hand">${esc(s.pp)}</span><s>${esc(s.name)}</s><span class="q">${esc(s.rest)}</span></span>`
        : `${esc(s.name)}<span class="q">${esc(s.rest)}</span>`}</span></label></li>`).join('')}</ul>
      ${ppCount ? `<div class="note pp-hint">${icon('leaf')}В шагах ниже используйте продукты, вписанные от руки</div>` : ''}
      <div class="sec-h"><h4>Приготовление</h4></div>
      <ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      ${showWakeHint ? `<div class="note">${icon('sun')}Экран не погаснет, пока открыт рецепт</div>` : ''}
    </div>`;
  refreshFavButton(id);
  const syncUncheck = () => { $('#vUncheck').hidden = !checked.size; };
  $('#viewPanel').querySelectorAll('.ing input').forEach(cb => cb.onchange = () => {
    const n = +cb.dataset.n; cb.checked ? checked.add(n) : checked.delete(n);
    store.set('checked:' + id, [...checked]); syncUncheck();
  });
  $('#vUncheck').onclick = () => { checked.clear(); store.set('checked:' + id, []); $('#viewPanel').querySelectorAll('.ing input').forEach(c => c.checked = false); syncUncheck(); };
  $('#vFav').onclick = () => toggleFav(r.id);
  if (ppCount) $('#vPP').onclick = () => {
    ppOn = !ppOn; ppOn ? ppIds.add(id) : ppIds.delete(id); store.set('pp', [...ppIds]);
    $('#vPP').setAttribute('aria-checked', ppOn); $('#viewPanel .ing').classList.toggle('pp', ppOn);
    $('#viewPanel .stats').classList.toggle('pp', ppOn); setPortions(portions);
  };
  // Калькулятор порций: пересчитываем только количества, отметки и ПП-замены остаются
  let portions = r.servings;
  const setPortions = n => {
    portions = Math.min(24, Math.max(1, n));
    const k = portions / r.servings, word = unitWord(r, portions);
    $('#sN').textContent = portions; $('#sLbl').textContent = word;
    $('#sMinus').disabled = portions <= 1; $('#sPlus').disabled = portions >= 24;
    $('#viewPanel').querySelectorAll('.ing .q').forEach((q, n) => q.textContent = scaleQty(swaps[n].rest, k));
    $('#vScaled').hidden = k === 1;
    $('#vScaledTxt').textContent = `Пересчитано на ${portions} ${unitWord(r, portions, true)} · ≈ ${kcalNow() * portions} ккал всего`;
  };
  $('#sMinus').onclick = () => setPortions(portions - 1);
  $('#sPlus').onclick = () => setPortions(portions + 1);
  $('#vScaleReset').onclick = () => setPortions(r.servings);
  setPortions(portions);
  if (canShare) $('#vShare').onclick = () => navigator.share({ title: r.title + (ppOn ? ' (ПП-версия)' : ''),
    text: `${r.title}${ppOn ? ' (ПП-версия)' : ''}\n${portions} ${unitWord(r, portions)}, ≈ ${kcalNow()} ккал ${unitOf(r)[4]}\n\nИнгредиенты:\n${swaps.map(s => '• ' + (ppOn && s.pp ? s.pp : s.name) + scaleQty(s.rest, portions / r.servings)).join('\n')}\n\nПриготовление:\n${r.steps.map((s, i) => `${i + 1}. ${s}`).join('\n')}` }).catch(() => {});
  openSheet('#viewSheet');
  $('#viewPanel').scrollTop = 0;
  keepAwake();
}

// ---------- Установка на телефон ----------
let deferredPrompt = null;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
$('#installBtn').innerHTML = icon('download') + 'Установить';
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').hidden = false; });
addEventListener('appinstalled', () => { $('#installBtn').hidden = true; toast('Приложение установлено'); });
if (isIOS && !isStandalone) $('#installBtn').hidden = false;
$('#installBtn').onclick = async () => {
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#installBtn').hidden = true; }
  else if (isIOS) alert('Как установить на iPhone:\n\n1. Нажмите кнопку «Поделиться» внизу Safari (квадрат со стрелкой)\n2. Выберите «На экран „Домой“»\n3. Нажмите «Добавить»');
};

// ---------- Работа без интернета и обновления ----------
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const offer = w => toast('Доступна новая версия', 'Обновить', () => w.postMessage('skipWaiting'), true);
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
    } catch {}
  });
}

// ---------- Главный экран-меню ----------
// В истории браузера меню — нижняя запись, список рецептов — запись { app: 1 } поверх него
function renderMenu() {
  const item = (go, name, n) => `<button class="mi-item" data-go="${go}"><span>${esc(name)}</span><span class="dots"></span><span class="n">${n}</span></button>`;
  $('#menuList').innerHTML = SECTIONS.map(s => item(s.id, s.title, RECIPES.filter(r => r.sections.includes(s.id)).length)).join('');
  $('#menuExtra').innerHTML = item('all', 'Все рецепты', RECIPES.length) + item('fav', 'Избранное', favorites.size);
}
function showMenu(withCover) {
  renderMenu();
  const m = $('#menu');
  m.classList.remove('leaving');
  m.classList.toggle('opened', !withCover);
  m.classList.toggle('instant', !withCover);   // при возврате разворот виден сразу, без перелистывания
  m.hidden = false; document.body.classList.add('menu-on');
  $('#hdr').inert = $('#main').inert = true;
  (withCover ? $('#menuCover') : m.querySelector('.mi-item')).focus({ preventScroll: true });
}
function leaveMenu(go) {
  Object.assign(state, freshFilters(), { q: '', section: go === 'fav' ? 'all' : go, favOnly: go === 'fav' });
  $('#q').value = ''; update(); scrollTo(0, 0); centerTab();
  const m = $('#menu');
  m.classList.add('leaving'); document.body.classList.remove('menu-on');
  $('#hdr').inert = $('#main').inert = false;
  setTimeout(() => { m.hidden = true; }, 350);
  history.pushState({ app: 1 }, '');
}
Promise.race([document.fonts.load('600 76px "Cormorant Garamond"', 'Меню'), new Promise(r => setTimeout(r, 1500))])
  .finally(() => $('#menu').classList.add('font-ready'));
$('#menuCover').onclick = () => { const m = $('#menu'); m.classList.remove('instant'); m.classList.add('opened'); };
$('#menu').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) leaveMenu(b.dataset.go); });
$('#menuBtn').onclick = () => { if (history.state && history.state.app) history.back(); else showMenu(false); };

// Быстрые действия с иконки приложения (долгое нажатие на Android): #fav или #<раздел> — сразу к рецептам
const startHash = location.hash.slice(1);
if (startHash) history.replaceState(null, '', location.pathname);
if (startHash === 'fav' || sectionById(startHash)) {
  if (startHash === 'fav') state.favOnly = true; else state.section = startHash;
  history.pushState({ app: 1 }, '');
} else showMenu(true);
update();
centerTab();
</script>
</body>
</html>
